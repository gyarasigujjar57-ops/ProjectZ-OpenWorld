name: Godot project validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.3-stable_linux.x86_64
      - name: Import and validate project
        run: godot-bin/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --quit
