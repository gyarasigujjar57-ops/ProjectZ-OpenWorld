name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "scenes/**"
      - "scripts/**"
      - "export_presets.cfg"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot Android export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -d "$ANDROID_HOME"
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-33" "platforms;android-34" "build-tools;33.0.2" "build-tools;34.0.0"
          set -o pipefail
          java -version
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Verify project imports
        run: godot --headless --editor --path . --quit

      - name: Export Android debug APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/ProjectZ-Android.apk
          test -s build/ProjectZ-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectZ-Android-debug
          path: build/ProjectZ-Android.apk
          if-no-files-found: error
          retention-days: 14
